name: sahajomy_mobile
description: "Sahajomy Flutter Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  go_router: ^13.0.0
  flutter_secure_storage: ^9.0.0

  # UI
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Scanning
  mobile_scanner: ^7.4.0
  image_picker: ^1.0.0
  qr_flutter: ^4.1.0

  # Networking
  json_annotation: ^4.8.0
  retrofit: ^4.1.0
  logger: ^2.0.0

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  json_serializable: ^6.7.0
  retrofit_generator: ^8.0.0
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  flutter_native_splash: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sahajomy-logo.svg
    - assets/branding/sahajomy-app-icon.png
    - assets/onboarding/illustration_1.svg
    - assets/onboarding/illustration_2.svg
    - assets/onboarding/illustration_3.svg

flutter_native_splash:
  color: "#062B44"
  image: assets/branding/sahajomy-app-icon.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#062B44"
    image: assets/branding/sahajomy-app-icon.png
    icon_background_color: "#062B44"
  ios: true
  web: false
