<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahajomy · Cargo Admin · Warehouse automation</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#e2e8f0}.phone{width:min(100%,393px);height:min(100dvh,852px)}@media(min-width:500px){.phone{height:852px;margin:24px auto;border:10px solid #0f172a;border-radius:38px;overflow:hidden;box-shadow:0 25px 70px #0f172a55}}button:active{transform:scale(.98)}</style></head>
<body class="font-sans antialiased"><main class="phone relative overflow-hidden bg-[#F7F8FA] text-slate-900"><header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-5"><button class="text-xl text-[#0F3D5E]">‹</button><div class="text-center"><p class="text-[10px] font-bold uppercase tracking-[.14em] text-[#FF6B4A]">Cargo Admin · Premium</p><h1 class="text-sm font-extrabold text-[#0F3D5E]">Warehouse automation</h1></div><span class="h-2 w-2 rounded-full bg-emerald-500"></span></header>
  <section class="h-[calc(100%-8.5rem)] overflow-y-auto pb-6"><div class="grid grid-cols-4 gap-px bg-slate-200"><div class="bg-white p-3"><p class="text-xl font-extrabold">12</p><p class="text-[9px] text-slate-500">Arrivals</p></div><div class="bg-white p-3"><p class="text-xl font-extrabold">8</p><p class="text-[9px] text-slate-500">Ready</p></div><div class="bg-white p-3"><p class="text-xl font-extrabold">6</p><p class="text-[9px] text-slate-500">Collected</p></div><div class="bg-white p-3"><p class="text-xl font-extrabold text-amber-700">2</p><p class="text-[9px] text-slate-500">Exceptions</p></div></div>
    <div class="px-5 pt-5"><h2 class="text-lg font-extrabold text-[#0F3D5E]">Quick operations</h2><div class="mt-3 grid grid-cols-2 gap-3"><button onclick="toast('Camera scanner opened')" class="bg-[#FF6B4A] p-4 text-left text-white"><span class="text-xl">⌗</span><span class="mt-2 block text-sm font-bold">Scan incoming parcel</span></button><button onclick="toast('Collection scanner opened')" class="bg-[#0F3D5E] p-4 text-left text-white"><span class="text-xl">▣</span><span class="mt-2 block text-sm font-bold">Verify collection</span></button><button onclick="toast('Manual intake remains available')" class="border border-slate-200 bg-white p-4 text-left"><span class="text-xl">✎</span><span class="mt-2 block text-sm font-bold">Manual intake</span></button><button onclick="toast('Warehouse QR tools opened')" class="border border-slate-200 bg-white p-4 text-left"><span class="text-xl">▦</span><span class="mt-2 block text-sm font-bold">Warehouse QR</span></button></div></div>
    <div class="px-5 pt-6"><div class="flex items-end justify-between"><div><h2 class="text-lg font-extrabold text-[#0F3D5E]">Recent parcels</h2><p class="text-xs text-slate-500">Manual and scanned receipts share one list.</p></div><button class="text-xs font-bold text-[#FF6B4A]">View all</button></div><div class="mt-3 divide-y divide-slate-200 border-y border-slate-200 bg-white"><div class="flex justify-between p-3"><div><p class="text-sm font-bold">SF123456789</p><p class="text-xs text-slate-500">Lusajo · assisted scan</p></div><span class="h-max bg-emerald-50 px-2 py-1 text-[10px] font-bold text-emerald-700">Paid · Ready</span></div><div class="flex justify-between p-3"><div><p class="text-sm font-bold">WRA-2026-A10F</p><p class="text-xs text-slate-500">Amina · barcode</p></div><span class="h-max bg-amber-50 px-2 py-1 text-[10px] font-bold text-amber-700">Unpaid</span></div></div></div>
    <section class="mx-5 mt-5 border border-dashed border-slate-300 bg-white p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Prototype states</p><div class="mt-2 flex flex-wrap gap-2"><button onclick="state('disabled')" class="bg-slate-100 px-2 py-1 text-[11px] font-bold">Entitlement off</button><button onclick="state('camera')" class="bg-slate-100 px-2 py-1 text-[11px] font-bold">Camera denied</button><button onclick="state('expired')" class="bg-slate-100 px-2 py-1 text-[11px] font-bold">Code expired</button></div></section>
  </section><nav class="absolute inset-x-0 bottom-0 border-t border-slate-200 bg-white px-5 pb-5 pt-2"><div class="flex justify-between"><button class="text-center text-slate-400"><span class="block text-lg">⌂</span><span class="text-[10px]">Home</span></button><button class="text-center text-[#FF6B4A]"><span class="block text-lg">⌗</span><span class="text-[10px] font-bold">Operations</span></button><button class="text-center text-slate-400"><span class="block text-lg">▤</span><span class="text-[10px]">Documents</span></button><button class="text-center text-slate-400"><span class="block text-lg">•••</span><span class="text-[10px]">More</span></button></div></nav></main>
<div id="overlay" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/40 p-5"><div class="w-full max-w-xs bg-white p-6"><h2 id="ot" class="text-lg font-extrabold text-[#0F3D5E]"></h2><p id="op" class="mt-2 text-sm leading-5 text-slate-500"></p><button onclick="closeState()" class="mt-5 w-full bg-[#0F3D5E] py-3 text-sm font-bold text-white">Continue with manual option</button></div></div><div id="toast" class="fixed inset-x-0 bottom-5 z-[60] mx-auto hidden w-max rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white"></div><script>function state(k){const d={disabled:['Automation not enabled','Premium tools are unavailable. Manual cargo intake remains fully usable.'],camera:['Camera unavailable','Allow camera access, choose a label image, or enter tracking details manually.'],expired:['Collection code expired','Do not release goods. Ask the customer to create a new collection request.']};ot.textContent=d[k][0];op.textContent=d[k][1];overlay.classList.replace('hidden','grid')}function closeState(){overlay.classList.replace('grid','hidden')}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}</script></body></html>
