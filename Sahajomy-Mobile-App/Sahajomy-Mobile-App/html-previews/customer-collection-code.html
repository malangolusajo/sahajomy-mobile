<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahajomy · Customer · Collection code</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#e2e8f0}.phone{width:min(100%,393px);height:min(100dvh,852px)}@media(min-width:500px){.phone{height:852px;margin:24px auto;border:10px solid #0f172a;border-radius:38px;overflow:hidden;box-shadow:0 25px 70px #0f172a55}}.qr{background:repeating-conic-gradient(#0f3d5e 0 25%,white 0 50%) 50%/18px 18px}</style></head>
<body class="font-sans antialiased"><main class="phone overflow-y-auto bg-[#F7F8FA] text-slate-900"><header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-5"><button class="text-xl text-[#0F3D5E]">‹</button><div class="text-center"><p class="text-[10px] font-bold uppercase tracking-[.14em] text-[#FF6B4A]">Collection request</p><h1 class="text-sm font-extrabold text-[#0F3D5E]">Show warehouse staff</h1></div><button onclick="toast('Screen brightness raised')" class="text-lg text-[#0F3D5E]">☀</button></header>
  <section class="px-5 py-6 text-center"><div class="mx-auto grid h-10 w-10 place-items-center rounded-full bg-emerald-50 text-emerald-700">✓</div><h2 class="mt-3 text-xl font-extrabold text-[#0F3D5E]">2 parcels selected</h2><p class="mt-1 text-sm text-slate-500">SEA CARGO Warehouse</p>
    <div id="code" class="mt-5 border-y border-emerald-200 bg-white py-5"><div class="qr mx-auto h-48 w-48 border-8 border-white shadow-sm" aria-label="Collection QR placeholder"></div><p class="mt-5 text-[10px] font-bold uppercase tracking-[.18em] text-slate-400">Collection PIN</p><p class="mt-1 font-mono text-4xl font-extrabold tracking-[.22em] text-[#0F3D5E]">482 913</p></div>
    <div class="mt-4 flex items-center justify-center gap-2 text-sm font-bold text-amber-700"><span>◷</span><span id="countdown">Expires in 14:59</span></div><p class="mt-1 text-xs text-slate-500">20 Aug 2026, 2:45 PM local time</p>
    <div class="mt-5 border-l-4 border-[#FF6B4A] bg-orange-50 p-4 text-left"><p class="text-sm font-bold text-slate-900">Single use</p><p class="mt-1 text-xs leading-5 text-slate-600">Staff must verify payment and physically hand over both parcels. You cannot mark them collected yourself.</p></div>
    <div class="mt-5 flex gap-2"><button onclick="show('expired')" class="flex-1 border border-slate-300 bg-white py-3 text-xs font-bold text-slate-600">Expired state</button><button onclick="show('used')" class="flex-1 border border-slate-300 bg-white py-3 text-xs font-bold text-slate-600">Used state</button></div>
  </section></main><div id="overlay" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/40 p-5"><div class="w-full max-w-xs bg-white p-6 text-center"><div id="oi" class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-rose-50 text-rose-700">!</div><h2 id="ot" class="mt-4 text-lg font-extrabold text-[#0F3D5E]"></h2><p id="op" class="mt-2 text-sm text-slate-500"></p><button onclick="closeState()" class="mt-5 w-full bg-[#0F3D5E] py-3 text-sm font-bold text-white">Return</button></div></div><div id="toast" class="fixed inset-x-0 bottom-5 z-[60] mx-auto hidden w-max rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white"></div><script>let s=899;setInterval(()=>{if(s>0)s--;countdown.textContent=`Expires in ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);function show(k){const d={expired:['Code expired','Request a new collection code from the warehouse parcel screen.'],used:['Already collected','This single-use code was accepted and can no longer be used.']};ot.textContent=d[k][0];op.textContent=d[k][1];overlay.classList.replace('hidden','grid')}function closeState(){overlay.classList.replace('grid','hidden')}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}</script></body></html>
