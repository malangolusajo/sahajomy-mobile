<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sahajomy · Super admin · Platform overview</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#e2e8f0}.phone{width:min(100%,393px);height:min(100dvh,852px)}@media(min-width:500px){.phone{height:852px;margin:24px auto;border:10px solid #0f172a;border-radius:38px;overflow:hidden;box-shadow:0 25px 70px #0f172a55}}button{transition:.15s}button:active{transform:scale(.98)}</style></head><body class="font-sans antialiased"><main class="phone relative overflow-hidden bg-[#F7F8FA] text-slate-900"><header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-5"><button onclick="toast('Back navigation preview')" class="text-xl text-[#0F3D5E]">‹</button><div class="text-center"><p class="text-[10px] font-bold uppercase tracking-[.14em] text-[#FF6B4A]">Super admin</p><h1 class="text-sm font-extrabold text-[#0F3D5E]">Dashboard</h1></div><button onclick="toast('Notifications preview')" class="relative text-lg text-[#0F3D5E]">♧<i class="absolute -right-1 top-0 h-1.5 w-1.5 rounded-full bg-[#FF6B4A]"></i></button></header><section class="h-[calc(100%-8.75rem)] overflow-y-auto px-5 pb-6 pt-5"><h2 class="text-2xl font-extrabold text-[#0F3D5E]">Platform overview</h2><p class="mt-1 text-sm leading-5 text-slate-500">Governance at a glance</p><div class="mt-5"><div class="grid grid-cols-2 gap-3"><div class="rounded-2xl bg-[#0F3D5E] p-4 text-white"><p class="text-xs text-blue-100">Active users</p><p class="mt-2 text-2xl font-extrabold">1,248</p><p class="mt-1 text-[11px] text-emerald-200">+8.4% this month</p></div><div class="rounded-2xl bg-[#FF6B4A] p-4 text-white"><p class="text-xs text-orange-100">Needs review</p><p class="mt-2 text-2xl font-extrabold">12</p><p class="mt-1 text-[11px] text-orange-100">User approvals</p></div></div><div class="mt-4 rounded-2xl border border-slate-200 bg-white p-4"><div class="flex items-center justify-between"><p class="font-bold text-slate-900">Operational health</p><span class="text-xs font-bold text-emerald-600">Healthy</span></div><div class="mt-4 flex h-16 items-end gap-2"><i class="w-full rounded-t bg-[#0F3D5E]" style="height:35%"></i><i class="w-full rounded-t bg-[#0F3D5E]" style="height:50%"></i><i class="w-full rounded-t bg-[#0F3D5E]" style="height:42%"></i><i class="w-full rounded-t bg-[#0F3D5E]" style="height:65%"></i><i class="w-full rounded-t bg-[#0F3D5E]" style="height:55%"></i><i class="w-full rounded-t bg-[#0F3D5E]" style="height:78%"></i><i class="w-full rounded-t bg-[#0F3D5E]" style="height:70%"></i></div><p class="mt-2 text-xs text-slate-500">Weekly platform activity</p></div><div class="mt-4 space-y-3"><button onclick="toast('12 user approvals')" class="w-full rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm"><div class="flex items-start justify-between gap-3"><div><p class="font-bold text-slate-900">12 user approvals</p><p class="mt-1 text-xs leading-5 text-slate-500">Review pending customer and agent profiles.</p></div><span class="shrink-0 rounded-full bg-orange-50 px-2.5 py-1 text-[10px] font-bold text-[#E85A3A]">Review</span></div></button><button onclick="toast('Commission rate')" class="w-full rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm"><div class="flex items-start justify-between gap-3"><div><p class="font-bold text-slate-900">Commission rate</p><p class="mt-1 text-xs leading-5 text-slate-500">Current platform rate is 8%.</p></div><span class="shrink-0 rounded-full bg-orange-50 px-2.5 py-1 text-[10px] font-bold text-[#E85A3A]">Settings</span></div></button></div></div><section class="mt-5 rounded-xl border border-dashed border-slate-300 bg-white p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Prototype states</p><div class="mt-2 flex gap-2"><button onclick="showState('loading')" class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-bold">Loading</button><button onclick="showState('empty')" class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-bold">Empty</button><button onclick="showState('error')" class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-bold">Error</button></div></section></section><nav class="absolute bottom-0 inset-x-0 border-t border-slate-200 bg-white px-5 pt-2 pb-5"><div class="flex justify-between"><button onclick="toast('Home navigation preview')" class="min-w-12 text-center text-[#FF6B4A]"><span class="block text-lg leading-5">⌂</span><span class="text-[10px] font-semibold">Home</span></button><button onclick="toast('Users navigation preview')" class="min-w-12 text-center text-slate-400"><span class="block text-lg leading-5">♙</span><span class="text-[10px] font-semibold">Users</span></button><button onclick="toast('Activity navigation preview')" class="min-w-12 text-center text-slate-400"><span class="block text-lg leading-5">◫</span><span class="text-[10px] font-semibold">Activity</span></button><button onclick="toast('Alerts navigation preview')" class="min-w-12 text-center text-slate-400"><span class="block text-lg leading-5">♧</span><span class="text-[10px] font-semibold">Alerts</span></button></div></nav></main><div id="state" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/40 p-5"><div class="w-full max-w-xs rounded-2xl bg-white p-6 text-center shadow-2xl"><div id="state-icon" class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-orange-50 text-xl">…</div><h2 id="state-title" class="mt-4 text-lg font-extrabold text-[#0F3D5E]"></h2><p id="state-text" class="mt-2 text-sm leading-5 text-slate-500"></p><button onclick="closeState()" class="mt-5 w-full rounded-xl bg-[#0F3D5E] py-3 text-sm font-bold text-white">Return to screen</button></div></div><div id="toast" class="fixed inset-x-0 bottom-5 z-[60] mx-auto hidden w-max max-w-[90%] rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white shadow-xl"></div><script>function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}function showState(k){const d={loading:['…','Loading','Fetching the latest platform information.'],empty:['○','Nothing here yet','This is how an empty state guides the next action.'],error:['!','Something went wrong','Check your connection, then try again.']};const [i,t,x]=d[k];document.getElementById('state-icon').textContent=i;document.getElementById('state-title').textContent=t;document.getElementById('state-text').textContent=x;document.getElementById('state').classList.remove('hidden');document.getElementById('state').classList.add('grid')}function closeState(){const s=document.getElementById('state');s.classList.add('hidden');s.classList.remove('grid')}</script></body></html>
