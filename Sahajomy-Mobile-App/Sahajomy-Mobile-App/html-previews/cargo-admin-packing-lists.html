<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sahajomy · Cargo admin · Consolidated packing lists</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script><style>body{background:#e2e8f0}.phone{width:min(100%,393px);height:min(100dvh,852px)}@media(min-width:500px){.phone{height:852px;margin:24px auto;border:10px solid #0f172a;border-radius:38px;overflow:hidden;box-shadow:0 25px 70px #0f172a55}}button{transition:.15s}button:active{transform:scale(.98)}</style></head>
<body class="font-sans antialiased"><main class="phone relative overflow-hidden bg-[#F7F8FA] text-slate-900"><header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-5"><button onclick="toast('Back navigation preview')" class="text-xl text-[#0F3D5E]">‹</button><div class="text-center"><p class="text-[10px] font-bold uppercase tracking-[.14em] text-[#FF6B4A]">Cargo admin</p><h1 class="text-sm font-extrabold text-[#0F3D5E]">Packing lists</h1></div><button onclick="toast('Notifications preview')" class="relative text-lg text-[#0F3D5E]">♧<i class="absolute -right-1 top-0 h-1.5 w-1.5 rounded-full bg-[#FF6B4A]"></i></button></header><section class="h-[calc(100%-8.75rem)] overflow-y-auto pb-6"><div class="px-5 pt-5"><h2 class="text-2xl font-extrabold text-[#0F3D5E]">Consolidated packing lists</h2><p class="mt-1 text-sm leading-5 text-slate-500">Generate and review packing lists across active reservations.</p></div><div class="space-y-4 px-5 pt-5"><button onclick="toast('MSKU 8392014')" class="w-full rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm"><div class="flex items-start justify-between gap-3"><div><p class="font-bold text-slate-900">MSKU 8392014</p><p class="mt-1 text-xs leading-5 text-slate-500">38 reservations · Last updated today</p></div><span class="rounded-full bg-orange-50 px-2.5 py-1 text-[10px] font-bold text-[#E85A3A]">Ready</span></div></button><button onclick="toast('TEMU 0038291')" class="w-full rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm"><div class="flex items-start justify-between gap-3"><div><p class="font-bold text-slate-900">TEMU 0038291</p><p class="mt-1 text-xs leading-5 text-slate-500">17 reservations · Needs review</p></div><span class="rounded-full bg-orange-50 px-2.5 py-1 text-[10px] font-bold text-[#E85A3A]">Draft</span></div></button></div><div class="px-5 pt-5"><button onclick="toast('Generate list action')" class="w-full rounded-xl bg-[#FF6B4A] py-3.5 text-sm font-bold text-white">Generate list</button></div><section class="mx-5 mt-5 rounded-xl border border-dashed border-slate-300 bg-white p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Prototype states</p><div class="mt-2 flex gap-2"><button onclick="showState('loading')" class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-bold">Loading</button><button onclick="showState('empty')" class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-bold">Empty</button><button onclick="showState('error')" class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-bold">Error</button></div></section></section><nav class="absolute bottom-0 inset-x-0 border-t border-slate-200 bg-white px-5 pt-2 pb-5"><div class="flex justify-between"><button class="min-w-12 text-center text-[#FF6B4A]" onclick="toast('Home navigation preview')"><span class="block text-lg leading-5">⌂</span><span class="text-[10px] font-semibold">Home</span></button><button class="min-w-12 text-center text-slate-400" onclick="toast('Containers navigation preview')"><span class="block text-lg leading-5">▦</span><span class="text-[10px] font-semibold">Containers</span></button><button class="min-w-12 text-center text-slate-400" onclick="toast('Orders navigation preview')"><span class="block text-lg leading-5">≡</span><span class="text-[10px] font-semibold">Orders</span></button><button class="min-w-12 text-center text-slate-400" onclick="toast('Alerts navigation preview')"><span class="block text-lg leading-5">♧</span><span class="text-[10px] font-semibold">Alerts</span></button></div></nav></main><div id="state" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/40 p-5"><div class="w-full max-w-xs rounded-2xl bg-white p-6 text-center shadow-2xl"><div id="state-icon" class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-orange-50 text-xl">…</div><h2 id="state-title" class="mt-4 text-lg font-extrabold text-[#0F3D5E]"></h2><p id="state-text" class="mt-2 text-sm leading-5 text-slate-500"></p><button onclick="closeState()" class="mt-5 w-full rounded-xl bg-[#0F3D5E] py-3 text-sm font-bold text-white">Return to screen</button></div></div><div id="toast" class="fixed inset-x-0 bottom-5 z-[60] mx-auto hidden w-max max-w-[90%] rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white shadow-xl"></div><script>function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}function showState(kind){const d={loading:['…','Loading','Fetching the latest Sahajomy information.'],empty:['○','Nothing here yet','This is how an empty state will guide the next action.'],error:['!','Something went wrong','Check your connection, then try again.']};const [icon,title,text]=d[kind];document.getElementById('state-icon').textContent=icon;document.getElementById('state-title').textContent=title;document.getElementById('state-text').textContent=text;document.getElementById('state').classList.remove('hidden');document.getElementById('state').classList.add('grid')}function closeState(){const s=document.getElementById('state');s.classList.add('hidden');s.classList.remove('grid')}</script></body></html>
