<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sahajomy · Customer · Welcome to easier shipping</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script><style>body{background:#e2e8f0}.phone{width:min(100%,393px);height:min(100dvh,852px)}@media(min-width:500px){.phone{height:852px;margin:24px auto;border:10px solid #0f172a;border-radius:38px;overflow:hidden;box-shadow:0 25px 70px #0f172a55}}button{transition:.15s}button:active{transform:scale(.98)}</style></head>
<body class="font-sans antialiased"><main class="phone relative overflow-hidden bg-[#F7F8FA] text-slate-900"><div class="flex h-full flex-col justify-between px-6 pb-7 pt-14"><div><div class="grid h-16 w-16 place-items-center rounded-3xl bg-[#0F3D5E] text-3xl text-white">S</div><p class="mt-10 text-sm font-bold uppercase tracking-[.18em] text-[#FF6B4A]">Sahajomy</p><h1 class="mt-3 text-4xl font-extrabold leading-tight text-[#0F3D5E]">Ship smarter.<br>Grow further.</h1><p class="mt-5 leading-7 text-slate-500">Container shipping and sourcing built around your business.</p></div><div><div class="mb-5 flex gap-2"><i class="h-2 w-8 rounded-full bg-[#FF6B4A]"></i><i class="h-2 w-2 rounded-full bg-slate-200"></i><i class="h-2 w-2 rounded-full bg-slate-200"></i></div><button onclick="toast('Welcome to Sahajomy')" class="w-full rounded-xl bg-[#FF6B4A] px-4 py-4 font-bold text-white">Get started</button><button class="mt-3 w-full py-3 text-sm font-bold text-[#0F3D5E]">I already have an account</button></div></div></main><div id="state" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/40 p-5"><div class="w-full max-w-xs rounded-2xl bg-white p-6 text-center shadow-2xl"><div id="state-icon" class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-orange-50 text-xl">…</div><h2 id="state-title" class="mt-4 text-lg font-extrabold text-[#0F3D5E]"></h2><p id="state-text" class="mt-2 text-sm leading-5 text-slate-500"></p><button onclick="closeState()" class="mt-5 w-full rounded-xl bg-[#0F3D5E] py-3 text-sm font-bold text-white">Return to screen</button></div></div><div id="toast" class="fixed inset-x-0 bottom-5 z-[60] mx-auto hidden w-max max-w-[90%] rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white shadow-xl"></div><script>function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}function showState(kind){const d={loading:['…','Loading','Fetching the latest Sahajomy information.'],empty:['○','Nothing here yet','This is how an empty state will guide the next action.'],error:['!','Something went wrong','Check your connection, then try again.']};const [icon,title,text]=d[kind];document.getElementById('state-icon').textContent=icon;document.getElementById('state-title').textContent=title;document.getElementById('state-text').textContent=text;document.getElementById('state').classList.remove('hidden');document.getElementById('state').classList.add('grid')}function closeState(){const s=document.getElementById('state');s.classList.add('hidden');s.classList.remove('grid')}</script></body></html>
