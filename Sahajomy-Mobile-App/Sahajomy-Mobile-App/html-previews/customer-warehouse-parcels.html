<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahajomy · Customer · My warehouse parcels</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#e2e8f0}.phone{width:min(100%,393px);height:min(100dvh,852px)}@media(min-width:500px){.phone{height:852px;margin:24px auto;border:10px solid #0f172a;border-radius:38px;overflow:hidden;box-shadow:0 25px 70px #0f172a55}}button:active{transform:scale(.98)}</style></head>
<body class="font-sans antialiased"><main class="phone relative overflow-hidden bg-[#F7F8FA] text-slate-900">
  <header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-5"><button class="text-xl text-[#0F3D5E]">‹</button><div class="text-center"><p class="text-[10px] font-bold uppercase tracking-[.14em] text-[#FF6B4A]">Secure warehouse access</p><h1 class="text-sm font-extrabold text-[#0F3D5E]">My parcels</h1></div><span class="text-lg text-[#0F3D5E]">⌂</span></header>
  <section class="h-[calc(100%-4rem)] overflow-y-auto pb-28"><div class="px-5 pt-5"><h2 class="text-2xl font-extrabold text-[#0F3D5E]">SEA CARGO Warehouse</h2><p class="mt-1 text-sm leading-5 text-slate-500">Only parcels linked to your account at this scanned warehouse are shown.</p></div>
    <div class="mx-5 mt-5 border-y border-slate-200 bg-white">
      <label class="flex gap-3 border-b border-slate-200 p-4"><input id="p1" type="checkbox" class="mt-1 h-5 w-5 accent-[#FF6B4A]" onchange="selected()"><span class="min-w-0 flex-1"><span class="block font-bold">SF123456789</span><span class="mt-1 block text-xs text-slate-500">Shipping mark SEA-24015 · 10 kg · Received today</span><span class="mt-2 inline-block bg-emerald-50 px-2 py-1 text-[10px] font-bold text-emerald-700">Paid · Ready for collection</span></span></label>
      <label class="flex gap-3 border-b border-slate-200 p-4"><input id="p2" type="checkbox" class="mt-1 h-5 w-5 accent-[#FF6B4A]" onchange="selected()"><span class="min-w-0 flex-1"><span class="block font-bold">WRI-2026-00142</span><span class="mt-1 block text-xs text-slate-500">2 cartons · 24 kg · Received 18 Aug</span><span class="mt-2 inline-block bg-emerald-50 px-2 py-1 text-[10px] font-bold text-emerald-700">Paid · Ready for collection</span></span></label>
      <div class="flex gap-3 p-4 opacity-75"><input type="checkbox" disabled class="mt-1 h-5 w-5"><span class="min-w-0 flex-1"><span class="block font-bold">AIR-883104</span><span class="mt-1 block text-xs text-slate-500">1 carton · 4.5 kg · Received 19 Aug</span><span class="mt-2 inline-block bg-amber-50 px-2 py-1 text-[10px] font-bold text-amber-700">Payment required</span><span class="mt-2 block text-xs text-amber-700">Pay before requesting collection.</span></span></div>
    </div>
    <section class="mx-5 mt-5 border border-dashed border-slate-300 bg-white p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Prototype states</p><div class="mt-2 flex flex-wrap gap-2"><button onclick="state('loading')" class="bg-slate-100 px-2 py-1 text-[11px] font-bold">Loading</button><button onclick="state('empty')" class="bg-slate-100 px-2 py-1 text-[11px] font-bold">Empty</button><button onclick="state('invalid')" class="bg-slate-100 px-2 py-1 text-[11px] font-bold">Invalid QR</button></div></section>
  </section>
  <div class="absolute inset-x-0 bottom-0 border-t border-slate-200 bg-white p-4"><button id="collect" disabled onclick="toast('Collection request created for selected parcels')" class="w-full rounded-xl bg-[#FF6B4A] py-3.5 text-sm font-bold text-white disabled:opacity-40">Select parcels to collect</button></div>
</main><div id="overlay" class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/40 p-5"><div class="w-full max-w-xs bg-white p-6 text-center shadow-2xl"><h2 id="ot" class="text-lg font-extrabold text-[#0F3D5E]"></h2><p id="op" class="mt-2 text-sm text-slate-500"></p><button onclick="closeState()" class="mt-5 w-full bg-[#0F3D5E] py-3 text-sm font-bold text-white">Return</button></div></div><div id="toast" class="fixed inset-x-0 bottom-5 z-[60] mx-auto hidden w-max max-w-[90%] rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white"></div>
<script>function selected(){const n=[p1,p2].filter(x=>x.checked).length;collect.disabled=!n;collect.textContent=n?`Collect ${n} selected parcel${n>1?'s':''}`:'Select parcels to collect'}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}function state(k){const d={loading:['Loading parcels','Checking this warehouse securely…'],empty:['No parcels here','No active parcels linked to your account were found.'],invalid:['Warehouse link unavailable','This QR is invalid, revoked, or automation is disabled.']};ot.textContent=d[k][0];op.textContent=d[k][1];overlay.classList.replace('hidden','grid')}function closeState(){overlay.classList.replace('grid','hidden')}</script></body></html>
