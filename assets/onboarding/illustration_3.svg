<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGradient)"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="300" x2="300" y2="0">
      <stop offset="0%" stop-color="#0F3D5E"/>
      <stop offset="50%" stop-color="#1A5A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- World map silhouette -->
  <g fill="white" opacity="0.15">
    <!-- Africa -->
    <path d="M140 100 Q150 85 160 95 Q170 110 165 130 Q155 140 145 130 Q135 120 140 100"/>
    <!-- Asia -->
    <path d="M190 40 Q210 35 230 45 Q240 60 235 80 Q225 95 210 90 Q200 75 190 55 Q185 45 190 40"/>
    <!-- Europe -->
    <path d="M165 40 Q180 35 190 40 Q195 55 185 65 Q175 60 165 50 Q155 45 165 40"/>
    <!-- Americas -->
    <path d="M60 80 Q70 70 85 75 Q95 90 90 110 Q80 130 65 135 Q55 120 50 100 Q55 90 60 80"/>
  </g>

  <!-- Connection lines between continents -->
  <g stroke="#FF6B4A" stroke-width="2" stroke-dasharray="8 4" opacity="0.8">
    <path d="M160 115 Q200 90 220 70" fill="none"/>
    <path d="M160 115 Q120 130 85 105" fill="none"/>
    <path d="M220 70 Q250 80 270 100" fill="none"/>
  </g>

  <!-- Animated pulse points -->
  <g>
    <!-- Dar es Salaam -->
    <circle cx="160" cy="115" r="8" fill="#FF6B4A" opacity="0.3">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="115" r="4" fill="#FF6B4A"/>

    <!-- Shanghai -->
    <circle cx="220" cy="70" r="8" fill="#059669" opacity="0.3">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="220" cy="70" r="4" fill="#059669"/>

    <!-- Dubai -->
    <circle cx="190" cy="90" r="8" fill="#D97706" opacity="0.3">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="190" cy="90" r="4" fill="#D97706"/>

    <!-- Singapore -->
    <circle cx="175" cy="135" r="8" fill="#2563EB" opacity="0.3">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="175" cy="135" r="4" fill="#2563EB"/>
  </g>

  <!-- Central growth chart -->
  <g transform="translate(75, 180)">
    <!-- Chart background -->
    <rect x="0" y="0" width="150" height="90" rx="16" fill="white" opacity="0.1"/>
    <rect x="0" y="0" width="150" height="90" rx="16" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>

    <!-- Chart bars -->
    <g fill="#FF6B4A">
      <rect x="15" y="60" width="18" height="20" rx="3">
        <animate attributeName="height" values="0;20" dur="0.8s" begin="0.2s" fill="freeze"/>
        <animate attributeName="y" values="80;60" dur="0.8s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="40" y="45" width="18" height="35" rx="3">
        <animate attributeName="height" values="0;35" dur="0.8s" begin="0.4s" fill="freeze"/>
        <animate attributeName="y" values="80;45" dur="0.8s" begin="0.4s" fill="freeze"/>
      </rect>
      <rect x="65" y="30" width="18" height="50" rx="3">
        <animate attributeName="height" values="0;50" dur="0.8s" begin="0.6s" fill="freeze"/>
        <animate attributeName="y" values="80;30" dur="0.8s" begin="0.6s" fill="freeze"/>
      </rect>
      <rect x="90" y="20" width="18" height="60" rx="3">
        <animate attributeName="height" values="0;60" dur="0.8s" begin="0.8s" fill="freeze"/>
        <animate attributeName="y" values="80;20" dur="0.8s" begin="0.8s" fill="freeze"/>
      </rect>
      <rect x="115" y="10" width="18" height="70" rx="3">
        <animate attributeName="height" values="0;70" dur="0.8s" begin="1s" fill="freeze"/>
        <animate attributeName="y" values="80;10" dur="0.8s" begin="1s" fill="freeze"/>
      </rect>
    </g>

    <!-- Trend line -->
    <path d="M24 80 Q49 65 74 50 Q99 35 124 20"
          stroke="#FF6B4A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="200;0" dur="1.5s" begin="1.2s" fill="freeze"/>
    </path>
  </g>

  <!-- Floating metric cards -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="110" height="50" rx="10" fill="white" opacity="0.15"/>
    <text x="55" y="20" text-anchor="middle" font-family="system-ui" font-size="9" fill="white" opacity="0.8">PERSONAL</text>
    <text x="55" y="38" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="800" fill="white">SHIPMENTS</text>
  </g>

  <g transform="translate(170, 20)">
    <rect x="0" y="0" width="110" height="50" rx="10" fill="white" opacity="0.15"/>
    <text x="55" y="20" text-anchor="middle" font-family="system-ui" font-size="9" fill="white" opacity="0.8">SOURCING</text>
    <text x="55" y="38" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="800" fill="white">ORDERS</text>
  </g>

  <g transform="translate(20, 85)">
    <rect x="0" y="0" width="110" height="50" rx="10" fill="white" opacity="0.15"/>
    <text x="55" y="20" text-anchor="middle" font-family="system-ui" font-size="9" fill="white" opacity="0.8">CARGO OPS</text>
    <text x="55" y="38" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="800" fill="white">WAREHOUSE</text>
  </g>

  <g transform="translate(170, 85)">
    <rect x="0" y="0" width="110" height="50" rx="10" fill="white" opacity="0.15"/>
    <text x="55" y="20" text-anchor="middle" font-family="system-ui" font-size="9" fill="white" opacity="0.8">PLATFORM</text>
    <text x="55" y="38" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="800" fill="white">OVERVIEW</text>
  </g>

  <!-- Sahajomy brand mark at center bottom -->
  <circle cx="150" cy="270" r="24" fill="white" opacity="0.2"/>
  <circle cx="150" cy="270" r="20" fill="#0F3D5E"/>
  <text x="150" y="278" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="800" fill="white">S</text>

  <!-- Tagline -->
  <text x="150" y="300" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="white" opacity="0.8" letter-spacing="2">Ship Smarter. Grow Further.</text>
</svg>
