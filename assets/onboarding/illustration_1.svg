<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Ocean background -->
  <rect width="300" height="200" y="100" fill="#E8F4FD"/>
  <path d="M0 180 Q75 160 150 180 Q225 200 300 180 L300 300 L0 300 Z" fill="#D0E8F5" opacity="0.6"/>
  <path d="M0 220 Q75 200 150 220 Q225 240 300 220 L300 300 L0 300 Z" fill="#B8E0F0" opacity="0.4"/>

  <!-- Container ship -->
  <g transform="translate(50, 80)">
    <!-- Hull -->
    <path d="M20 80 L180 80 L160 120 L40 120 Z" fill="#1A3A5C"/>
    <path d="M40 80 L160 80 L150 100 L50 100 Z" fill="#255A8A"/>

    <!-- Bridge -->
    <rect x="60" y="40" width="80" height="40" rx="4" fill="#255A8A"/>
    <rect x="70" y="45" width="60" height="30" rx="2" fill="#3A7BC8" opacity="0.3"/>

    <!-- Containers on deck -->
    <g fill="#FF6B4A">
      <rect x="25" y="50" width="30" height="30" rx="2"/>
      <rect x="60" y="50" width="30" height="30" rx="2" fill="#059669"/>
      <rect x="95" y="50" width="30" height="30" rx="2" fill="#FF6B4A"/>
      <rect x="130" y="50" width="30" height="30" rx="2" fill="#D97706"/>
      <rect x="165" y="50" width="30" height="30" rx="2" fill="#059669"/>
    </g>

    <!-- Second row of containers -->
    <g fill="#FF6B4A" opacity="0.8">
      <rect x="30" y="20" width="25" height="25" rx="2"/>
      <rect x="65" y="20" width="25" height="25" rx="2" fill="#059669"/>
      <rect x="100" y="20" width="25" height="25" rx="2" fill="#FF6B4A"/>
      <rect x="135" y="20" width="25" height="25" rx="2" fill="#D97706"/>
      <rect x="170" y="20" width="25" height="25" rx="2" fill="#059669"/>
    </g>

    <!-- Crane -->
    <path d="M150 10 L150 40" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 40 L170 40" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 10 L140 25 L160 25 Z" fill="#4A5568"/>
  </g>

  <!-- Sahajomy brand mark on ship -->
  <circle cx="100" cy="95" r="18" fill="#0F3D5E"/>
  <text x="100" y="102" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="white">S</text>

  <!-- Birds -->
  <g fill="#64748B" opacity="0.6">
    <path d="M250 60 Q260 50 270 60 Q280 70 270 60 Q260 50 250 60" />
    <path d="M270 80 Q280 70 290 80 Q300 90 290 80 Q280 70 270 80" />
    <path d="M220 50 Q230 40 240 50 Q250 60 240 50 Q230 40 220 50" />
  </g>
</svg>
